[package]
name = "aumic-tailwind-killer"
version = "3.1.4"
edition = "2021"
authors = ["Ingeniería Creativa <soporte@ingcrea.com>"]
description = "Transmutador nativo y multiplataforma de Tailwind a AUM-IC (Zero-Bloat)"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
rayon = "1.8"
walkdir = "2.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
sha2 = "0.10"
hex = "0.4"
fancy-regex = "0.19.2"
